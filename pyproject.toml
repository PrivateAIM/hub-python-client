[project]
name = "flame-hub-client"
version = "0.5.5"
description = "HTTP client for interacting with FLAME Hub services."
authors = [
    { name = "Maximilian Jugl" },
    { name = "Paul Brassel", email = "Paul.Brassel@medizin.uni-leipzig.de" }
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "httpx2 (>=2.7.0,<3.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta"
]

[project.urls]
homepage = "https://privateaim.de/"
documentation = "https://privateaim.github.io/hub-python-client/"
repository = "https://github.com/PrivateAIM/hub-python-client/"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "ruff (>=0.15.0,<0.16.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "testcontainers[minio,mysql,rabbitmq,redis,vault] (>=4.15.0,<5.0.0)",
    "readme-coverage-badger (>=1.1.0,<2.0.0)"
]
docs = [
    "sphinx (==8.1.3)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "sphinx-autobuild (==2024.10.3)",
    "numpydoc (>=1.10.0,<2.0.0)",
    "myst-parser (>=4,<5)"
]


[tool.poetry]
packages = [{ include = "flame_hub" }]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test."
]
env_files = [
    ".env",
    ".env.test"
]
filterwarnings = [
    "ignore:^The @wait_container_is_ready decorator:DeprecationWarning"
]
addopts = "--cov=flame_hub --cov-branch"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
